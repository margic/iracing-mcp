[package]
name = "iracing-mcp-server"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
axum = "0.7"
clap = { version = "4.5", features = ["derive"] }
iracing = "0.4.1"
iracing-broadcast = "0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.8"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "io-std", "net", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
winapi = { version = "0.3", features = ["errhandlingapi", "handleapi", "memoryapi", "winnt", "winuser"] }

[dev-dependencies]
http-body-util = "0.1"
tower = "0.5"
